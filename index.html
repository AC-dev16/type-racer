<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <title>TypeRacer</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container">
                <div class="mx-auto text-center">
                    <a class="navbar-brand d-block mb-2 text-white" href="#" aria-label="TypeRacer home">
                        <span class="fs-2">TypeRacer</span>
                    </a>
                    <button id="instructionsBtn" type="button" class="btn text-dark" style="background-color: #f8f9fa;">
                        Instructions
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <div class="row g-4">
            <!-- Left Column - Typing Game Area -->
            <div class="col-12 col-md-8">
                <div class="card h-100">
                    <div class="card-body">
                        
                        <!-- Difficulty Selection -->
                        <div class="input-group mb-4">
                            <label class="input-group-text" for="difficultySelect">Select Difficulty</label>
                            <select class="form-select" id="difficultySelect" aria-label="Select game difficulty">
                                <option value="easy" selected>Easy</option>
                                <option value="medium">Medium</option>
                                <option value="hard">Hard</option>
                            </select>
                        </div>

                        <!-- Sample Text to Type -->
                        <div class="mb-4">
                            <p>Test your typing speed by typing the text shown below:</p>
                            <div id="sampleText" class="p-3 bg-white border border-secondary rounded lh-base">
                                The quick brown fox jumps over the lazy dog.
                            </div>
                        </div>

                        <!-- Typing Input Box -->
                        <div class="mb-4">
                            <textarea 
                                id="typingInput" 
                                class="form-control bg-white border-secondary" 
                                rows="4" 
                                placeholder="Click the start button to begin the test"
                                disabled
                            ></textarea>
                        </div>

                        <!-- Control Buttons -->
                        <div class="d-flex gap-2 flex-wrap justify-content-center">
                            <button id="startBtn" class="btn" style="background-color: white; border: 2px solid #ff8400; color: black;">
                                Start
                            </button>
                            <button id="stopBtn" class="btn" style="background-color: white; border: 2px solid #ff8400; color: black;">
                                Stop
                            </button>
                            <button id="retryBtn" class="btn" style="background-color: white; border: 2px solid #ff8400; color: black;">
                                Retry
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column - Stats/Controls -->
            <div class="col-12 col-md-4">
                <div class="h-100">
                    <div>
                        
                        <!-- Results Area -->
                        <div class="results-section" style="box-shadow: 0 4px 8px rgba(255, 132, 0, 0.4);">
                            <div class="mb-3 p-3 rounded">
                                <h5 class="mb-3 text-center">Results</h5>
                                
                                <div class="text-center">
                                    <div class="mb-2">
                                        <span>Level: </span>
                                        <span id="levelResult">-</span>
                                    </div>
                                    
                                    <div class="mb-2">
                                        <span>Time: </span>
                                        <span id="timeResult">0</span>
                                        <span>s</span>
                                    </div>
                                    
                                    <div>
                                        <span>WPM: </span>
                                        <span id="wpmResult">0</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/87e7ffe589.js" crossorigin="anonymous"></script>
<!-- JavaScript -->
    <script src="assets/js/script.js"></script>
</body>
</html>
