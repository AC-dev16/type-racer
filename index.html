<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <title>TypeRacer</title>
</head>
<body>
    <header>
        <h1>TypeRacer</h1>
        <button>Instructions</button>
    </header>

    <main class="container">
        <section class="row typing-area justify-content-center">
            <div class="col-12 col-md-8 text-display">
                <div class="input-group mb-3">
                    <label class="input-group-text" for="inputGroupSelect01">Select Difficulty</label>
                    <select class="form-select" id="inputGroupSelect01">
                        <option selected>Choose...</option>
                        <option value="1">Easy</option>
                        <option value="2">Medium</option>
                        <option value="3">Hard</option>
                    </select>
                </div>
                <textarea id="input-area" rows="5" cols="20" placeholder="Click the start button to begin the test" disabled></textarea>
            </div>
            <div class="col-12 col-md-4 stats">
                <div class="border p-3 mb-3 align-items-center justify-content-center d-flex flex-column">
                    <h2>Results</h2>
                    <p>Time: <span id="time-remaining">60</span>s</p>
                    <p>WPM: <span id="wpm">0</span></p>
                    <p>Accuracy: <span id="accuracy">100</span>%</p>
                </div>
            </div>
        </section>
    </main>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/87e7ffe589.js" crossorigin="anonymous"></script>
<!-- JavaScript -->
    <script src="assets/js/script.js"></script>
</body>
</html>
